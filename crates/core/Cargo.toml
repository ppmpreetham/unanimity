[package]
name = "unanimity"
description = "Download one file over every network you and your friends have"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-channel = "2.5.0"
fast-socks5 = "1.0.0"
futures-util = "0.3.34"
mdns-sd = "0.22.0"
netdev = "0.47.0"
percent-encoding = "2.3.2"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks", "stream"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "net", "io-util", "macros", "time", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
