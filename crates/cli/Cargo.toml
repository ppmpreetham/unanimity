[package]
name = "unanimity-cli"
description = "Command line interface for unanimity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "unanimity"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
indicatif = "0.18.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
unanimity = { path = "../core" }
